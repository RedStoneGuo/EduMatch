# edu-material-harvest-dsh bundle patch: mount this package's skill provider
# into the host skill registry (its row is host-plane, so every agent preset's
# scope chain merges the skill it registers).
#
# This patch is applied over the dsh-base layer; later layers (the profile's
# own cordis.patch.yml and --patch overlays) can still address this row by id.
- insert:
    - id: edu-material-harvest
      name: 'edu-material-harvest-dsh'
